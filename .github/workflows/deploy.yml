name: Deploy to Fargate

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CDK_DIR: ./cdk # where cdk.json lives

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Needed because you build LINUX_ARM64 on an x86 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.CDK_DIR }}/package-lock.json

      - name: Install CDK deps
        working-directory: ${{ env.CDK_DIR }}
        run: npm ci

      - name: CDK deploy
        working-directory: ${{ env.CDK_DIR }}
        run: npx cdk deploy --all --require-approval never -c vpcId=${{ vars.VPC_ID }}
